# nginx server block — copy to /etc/nginx/sites-available/study.edaceylan.com,
# symlink into sites-enabled, then run:
#   sudo certbot --nginx -d study.edaceylan.com
# (certbot rewrites this file to add the SSL directives + an HTTP->HTTPS
# redirect server block automatically — the plain-HTTP block below is enough
# to hand it beforehand).
#
# Adjust server_name and the app root path to match your setup.

server {
    listen 80;
    server_name study.edaceylan.com;

    root /home/eda/english-study/dist;
    index index.html;

    # SPA fallback — react-router routes that aren't real files serve index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy API + auth routes to the Node/Express process from english-study.service
    location /api/ {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
